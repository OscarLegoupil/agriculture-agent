[project]
name = "kaggriculture"
version = "0.0.1"
description = "Applied ML on the Kaggriculture challenge."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Oscar Legoupil" }]
dependencies = [
    "kaggle-environments>=1.32.7",
    "kaggle>=1.6",
]

[project.scripts]
kagg-compare = "kaggriculture.eval.cli:main"
kagg-view = "kaggriculture.eval.view:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
]
notebooks = [
    "ipykernel>=6.29",
]
# Behind a corporate SSL-inspection proxy (e.g. Zscaler)? Install this extra
# and Python's SSL will use the Windows trust store instead of certifi's.
corp-proxy = [
    "pip-system-certs>=5.3",
]
tracking = [
    "mlflow>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggriculture"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "N",             # naming
    "RUF",           # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Notebooks use math-domain names (T, I0) and can import mid-cell for readability.
"notebooks/**" = ["N803", "N806", "E402"]
# Forecaster transcribes the simulator's math with matching symbol names.
"src/kaggriculture/market/forecaster.py" = ["N803", "N806"]
# importorskip must run before the tracking imports.
"tests/eval/test_tracking.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["kaggle_environments", "kaggle_environments.*", "mlflow", "mlflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
