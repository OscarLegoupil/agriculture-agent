name: ci

on:
  push:
    branches: [main, feat/competitive-agent, feat/competitive-agent-v2, feat/strategy-breakthrough]
  pull_request:
    branches: [main, feat/competitive-agent, feat/competitive-agent-v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest

      - name: Verify standalone artifact
        run: uv run python scripts/verify_submission.py --output data/interim/ci-packaging.json

      - name: Check artifact regeneration
        run: |
          uv run python scripts/package_submission.py
          git diff --exit-code -- submissions/20260909-v8

      - name: Verify frozen research challenger
        run: |
          uv run python scripts/build_phase2_challenger.py --output data/interim/ci-challenger
          uv run python scripts/restore_candidate.py 0098d9e4f77e2420cb4a09abd47e49f5160009cd0818ae37a793bc3e419ffc4b --output data/interim/ci-challenger-frozen/main.py
          uv run python scripts/verify_submission.py --source data/interim/ci-challenger/main.py --artifact data/interim/ci-challenger-frozen/main.py --output data/interim/ci-challenger-packaging.json
