name: v4_wheat_agg
description: >
  v4 physical setup, wheat-aggressive market policy. Sells wheat at 22
  (v4 is 25) and carrot at 32 to convert crop production faster when
  premiums are less relevant. Micro-controller tail salvage kicks in from
  day 24 (v4 is 25). Egg sell floor stays at 50.

crops:
  - {tile: [3, 4], crop: WHEAT}
  - {tile: [4, 4], crop: CARROT}
  - {tile: [3, 3], crop: CARROT}

structures:
  - {tile: [4, 3], kind: COOP, animal: GOOSE}

hand:
  primary_tiles: [[3, 3]]
  fallback_tiles: [[4, 4], [3, 4]]

land_buys: []

market_policy:
  seed_buy_order: [WHEAT, CARROT]
  animal_buy_order: [GOOSE]
  hire:
    from_day: 3
    per_day: 1
    price_cap: 10
  feed_stockpiles:
    - {product: WHEAT, for_animal: GOOSE, buy_below: 20, cap: 10, reserve: 2}
  sell_order: [WHEAT, CARROT, EGG, FERTILIZER]
  sell_min_price:
    WHEAT: 22
    CARROT: 32
    EGG: 50
    FERTILIZER: 90
  liquidate_from_day: 28
  shed_high_water: 80
